# Optional local stack with Postgres. The default `make dev` needs none of this
# (it uses SQLite); use compose when you want local to mirror production.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: insightflow
      POSTGRES_PASSWORD: insightflow
      POSTGRES_DB: insightflow
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightflow"]
      interval: 5s
      retries: 10

  api:
    build:
      context: apps/api
      args: { REQUIREMENTS: local }
    environment:
      APP_PROFILE: local
      DATABASE_URL: postgresql://insightflow:insightflow@db:5432/insightflow
      CORS_ORIGINS: http://localhost:3000
      ADAPTION_API_KEY: ${ADAPTION_API_KEY:-}
    ports: ["8787:8787"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:

